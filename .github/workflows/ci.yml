name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  analyze-and-test:
    name: Analyze & Dart tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    name: Android build & Kotlin tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # The Gradle wrapper is gitignored by the Flutter template, so a build
      # run materializes it before the Kotlin unit tests can be invoked.
      - name: Build debug APK
        run: flutter build apk --debug

      - name: Run Kotlin unit tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest --console=plain
